name: Build Electron EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Ручной запуск

jobs:
  build:
    runs-on: windows-latest # Для сборки .exe нужен Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build # Или ваша команда сборки Vite

      - name: Install electron-builder
        run: npm install -g electron-builder

      - name: Build Electron EXE
        run: |
          npm run electron:build # Или команда сборки Electron
          # Если используете electron-builder напрямую:
          # npx electron-builder --win --x64

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-exe
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/win-unpacked/
          retention-days: 30

      - name: Create Release (опционально)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
